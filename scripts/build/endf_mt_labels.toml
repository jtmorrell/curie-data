# MT -> column-label mapping for endf.db (reviewed as a build artifact).
#
# Column labels and the all_reactions index reproduce the previous
# generation's vocabulary: summary channels carry no product; emission
# channels compute a ground-state residual from the target plus the
# incident neutron minus the emitted particles; discrete-level families
# use numbered labels with a continuum terminator; particle-production
# sums store the particle letter as the product.
#
# Notes:
# - 'abs' is not an ENDF section: it is computed as MT18 + sum(MT102..117)
#   (the standard MT27 absorption definition) on the union grid.
# - 'damage' is MT444, produced by a HEATR pass (not present in raw files).
# - MT19 (first-chance fission) was indexed as outgoing 'f' by the previous
#   generation, colliding with MT18 on the three targets carrying both and
#   making the (n,f) lookup ambiguous there; it is now indexed as 'f1'
#   (the column label _f_ is unchanged).
# - Channels marked new="true" have no previous-generation label; they
#   appear where ENDF/B-VIII.1 evaluations carry the section and show up
#   as additions in the coverage diff.

[summary]                       # label = MT; product '' in the index
tot = 1
el = 2
non = 3
inl = 4
misc = 5
fis = 18                        # outgoing 'f'
f = 19                          # outgoing 'f1' (see note)
nf = 20
2nf = 21
3nf = 38
damage = 444

[emission]                      # label = emitted particles (residual computed)
g = ""                          # radiative capture: nothing emitted
2n = "n n"
3n = "n n n"
4n = "n n n n"
p = "p"
d = "d"
t = "t"
h = "h"
a = "a"
np = "n p"
na = "n a"
nd = "n d"
nt = "n t"
nh = "n h"
2np = "n n p"
n2p = "n p p"
npa = "n p a"
2na = "n n a"
3na = "n n n a"
n2a = "n a a"
n3a = "n a a a"
2a = "a a"
3a = "a a a"
2p = "p p"
pa = "p a"
t2a = "t a a"
d2a = "d a a"
pd = "p d"
pt = "p t"
da = "d a"
2nd = "n n d"
2n2a = "n n a a"
nd2a = "n d a a"
nt2a = "n t a a"
3np = "n n n p"

[emission_mt]                   # MT for each emission label
g = 102
2n = 16
3n = 17
4n = 37
p = 103
d = 104
t = 105
h = 106
a = 107
np = 28
na = 22
nd = 32
nt = 33
nh = 34
2np = 41
n2p = 44
npa = 45
2na = 24
3na = 25
n2a = 29
n3a = 23
2a = 108
3a = 109
2p = 111
pa = 112
t2a = 113
d2a = 114
pd = 115
pt = 116
da = 117
2nd = 11
2n2a = 30
nd2a = 35
nt2a = 36
3np = 42

[emission_new]                  # labels absent from the previous generation
labels = ["3a", "d2a", "2nd", "2n2a", "nd2a", "nt2a", "3np"]

[levels]                        # discrete-level families: label <n>0..<n>N + continuum <n>c
n = {first = 50, count = 41, continuum = 91}    # _n1_.._n40_ (MT50 = n0, elastic-like, unused)
p = {first = 600, count = 49, continuum = 649}
d = {first = 650, count = 49, continuum = 699}
t = {first = 700, count = 49, continuum = 749}
h = {first = 750, count = 49, continuum = 799}
a = {first = 800, count = 49, continuum = 849}

[production]                    # particle-production sums; product = particle letter
x_p = 203
x_d = 204
x_t = 205
x_h = 206
x_a = 207

[skip]                          # MF3 sections deliberately not stored
mts = [10, 27, 101, 151, 152, 153, 201, 202, 251, 252, 253, 301,
       452, 455, 456, 458]     # 27/101 are recomputed; 201/202 neutron/gamma
                               # production; 251-253 scattering parameters;
                               # 301 = HEATR total kerma (444 is kept);
                               # 452+ multiplicities live in MF1
